spring.application.name=agent
spring.data.mongodb.uri=${AGENT_MONGODB_URI}

# Logging level for easier debugging during buildathon
logging.level.com.pivot.agent=DEBUG

# Spring AI Native Google GenAI Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

# Show detailed errors
server.error.include-message=always
server.error.include-exception=true

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:secret_placeholder}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:webhook_placeholder}
